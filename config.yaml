# Cấu hình chung. Có thể override bằng biến môi trường LLM_PROVIDER / LLM_MODEL.
db_path: data/aer.duckdb
dictionary_path: data_dictionary.yaml
log_path: logs/agent_log.sqlite

max_rows: 1000            # tự thêm LIMIT nếu SQL không có
query_timeout_s: 30       # ngắt query chạy quá lâu
max_repair_attempts: 2    # số lần đưa lỗi lại cho LLM để sửa SQL

llm:
  provider: gemini        # gemini | groq | openrouter | ollama | anthropic | mock
  model: ""               # để trống = dùng model mặc định của provider (xem agent/llm.py)
  temperature: 0.0
